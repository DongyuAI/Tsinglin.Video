<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI 造型间 · H3 Studio</title>
<style>
  :root { --bg:#141414; --panel:#1e1e1e; --line:#333; --text:#ddd; --dim:#888; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Segoe UI","PingFang SC",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .tag { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:10px; padding:1px 8px; }
  header a { margin-left:auto; color:var(--dim); text-decoration:none; font-size:12px; }
  main { display:grid; grid-template-columns: 380px 1fr 420px; gap:18px; padding:18px 22px; align-items:start; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.08em; margin:0 0 10px; text-transform:uppercase; }
  .drop { border:1px dashed #444; border-radius:8px; height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:6px; color:var(--dim); cursor:pointer; overflow:hidden; position:relative; }
  .drop.small { height:110px; }
  .drop img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .drop span { position:relative; z-index:1; background:rgba(0,0,0,.55); padding:2px 8px; border-radius:6px; }
  .styles { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-height:320px; overflow:auto; }
  .style { border:1px solid var(--line); border-radius:7px; padding:8px 6px; text-align:center; cursor:pointer; font-size:12px; color:#bbb; }
  .style:hover { border-color:#555; }
  .style.on { border-color:var(--accent); color:#fff; background:#22304a; }
  .style small { display:block; color:var(--dim); font-size:10px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .row label { color:var(--dim); font-size:12px; width:64px; }
  input[type=text], input[type=number], select, textarea { background:#161616; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 8px; font:inherit; width:100%; }
  textarea { resize:vertical; min-height:56px; }
  button.primary { margin-top:14px; width:100%; padding:10px; border-radius:8px; border:0; background:var(--accent); color:#08111f;
    font-weight:700; cursor:pointer; font-size:14px; }
  button.primary:disabled { background:#2c3a52; color:#7d8ba3; cursor:not-allowed; }
  .bar { height:4px; background:#262626; border-radius:2px; overflow:hidden; margin-top:12px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  .result { aspect-ratio:16/9; background:#0d0d0d; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .result video, .result img { width:100%; height:100%; object-fit:contain; }
  .muted { color:var(--dim); font-size:12px; }
  pre { white-space:pre-wrap; word-break:break-word; color:#9fb3d1; font-size:11px; background:#111; border:1px solid var(--line);
        border-radius:6px; padding:8px; max-height:150px; overflow:auto; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:9px; border:1px solid var(--line); color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>AI 造型间</h1>
  <span class="tag">MiniMax-H3 · 参考生视频</span>
  <span class="tag" id="engine">引擎检测中…</span>
  <a href="/">← 回到节点画布</a>
</header>

<main>
  <section class="card">
    <h2>1 · 人像</h2>
    <div class="drop" id="dropPortrait"><span>点击上传正脸照</span></div>
    <h2 style="margin-top:16px">2 · 发型参考（可选）</h2>
    <div class="drop small" id="dropStyle"><span>上传目标发型图</span></div>
    <div class="row"><label>发色</label><select id="color"></select></div>
    <div class="row"><label>补充</label><input id="extra" type="text" placeholder="例如：保持微笑，暖光" /></div>
  </section>

  <section class="card">
    <h2>3 · 造型</h2>
    <div class="styles" id="styles"></div>
    <div class="row"><label>时长</label>
      <select id="frames"><option value="22">22 帧 · ~1s</option><option value="40">40 帧 · ~1.7s</option><option value="61">61 帧 · ~2.5s</option></select>
      <label style="width:auto">步数</label>
      <select id="steps"><option value="4">4（快）</option><option value="8">8</option><option value="20">20（慢）</option></select>
    </div>
    <div class="row"><label>尺寸</label>
      <select id="size"><option value="864x480">864×480</option><option value="1280x720">1280×720</option><option value="1920x1080">1920×1080</option></select>
      <label style="width:auto">种子</label><input id="seed" type="number" value="42" style="width:90px" />
    </div>
    <button class="primary" id="go" disabled>生成造型视频</button>
    <div class="bar"><i id="bar"></i></div>
    <div class="muted" id="status" style="margin-top:8px">等待上传人像</div>
  </section>

  <section class="card">
    <h2>结果</h2>
    <div class="result" id="result"><span class="muted">尚无结果</span></div>
    <div class="muted" id="meta" style="margin-top:10px"></div>
    <pre id="prompt" hidden></pre>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const state = { portrait:null, styleRef:null, styleId:'bob_blunt', job:null, timer:null };

async function engine() {
  try {
    const r = await (await fetch('/api/health')).json();
    const ok = r.sd_server?.running;
    const m = r.sd_server?.model;
    const name = typeof m === 'string' ? m : (m?.name || 'H3');
    $('#engine').textContent = ok ? '引擎常驻 · ' + name : '引擎未启动';
  } catch { $('#engine').textContent = '后端不可达'; }
}
engine();

async function loadStyles() {
  const d = await (await fetch('/api/style/styles')).json();
  $('#styles').innerHTML = d.styles.map(s =>
    `<div class="style ${s.id===state.styleId?'on':''}" data-id="${s.id}">${s.zh}<small>${s.en}</small></div>`).join('');
  document.querySelectorAll('.style').forEach(el => el.onclick = () => {
    state.styleId = el.dataset.id;
    document.querySelectorAll('.style').forEach(x => x.classList.toggle('on', x === el));
  });
  $('#color').innerHTML = Object.entries(d.colors).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  $('#frames').value = String(d.defaults.frames);
  $('#steps').value = String(d.defaults.steps);
}
loadStyles();

async function upload(file, which) {
  const fd = new FormData(); fd.append('file', file);
  const r = await (await fetch('/api/upload', { method:'POST', body:fd })).json();
  if (!r.ok) { alert('上传失败'); return; }
  state[which] = r.ref;
  const box = which === 'portrait' ? $('#dropPortrait') : $('#dropStyle');
  box.innerHTML = `<img src="${r.url}" alt="" /><span>${which==='portrait'?'已上传人像':'已上传发型参考'}</span>`;
  $('#go').disabled = !state.portrait;
  $('#status').textContent = state.portrait ? '就绪，可以生成' : '等待上传人像';
}

$('#dropPortrait').onclick = () => pick('portrait');
$('#dropStyle').onclick = () => pick('styleRef');
function pick(which) {
  const i = document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange = () => i.files[0] && upload(i.files[0], which);
  i.click();
}

$('#go').onclick = async () => {
  if (!state.portrait) return;
  $('#go').disabled = true; $('#status').textContent = '排队中…'; $('#bar').style.width = '2%';
  const [w,h] = $('#size').value.split('x').map(Number);
  const body = {
    portrait: state.portrait, style_ref: state.styleRef, style_id: state.styleId,
    color: $('#color').value, extra: $('#extra').value, width: w, height: h,
    frames: Number($('#frames').value), steps: Number($('#steps').value), seed: Number($('#seed').value),
  };
  const j = await (await fetch('/api/style/run', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })).json();
  if (j.error) { $('#status').textContent = '失败：' + j.error; $('#go').disabled = false; return; }
  state.job = j.id;
  $('#prompt').hidden = false; $('#prompt').textContent = j.meta.prompt;
  poll();
};

async function poll() {
  clearTimeout(state.timer);
  const r = await fetch('/api/style/jobs/' + state.job);
  if (!r.ok) return;
  const j = await r.json();
  const pct = Math.round((j.progress || 0) * 100);
  $('#bar').style.width = Math.max(2, pct) + '%';
  $('#status').textContent = `${j.status} · ${pct}% · ${Math.round(j.elapsed)}s`;
  if (j.status === 'completed' || j.status === 'done') {
    $('#bar').style.width = '100%';
    const m = (j.media || [])[0];
    if (m) {
      const url = m.url || `/api/files/${j.id}/${m.name}`;
      $('#result').innerHTML = `<video src="${url}" controls autoplay loop playsinline></video>`;
      $('#meta').textContent = `${j.meta.style_id} · ${j.meta.color} · ${j.payload.width}×${j.payload.height} · ${j.payload.video_frames} 帧 · ${j.payload.sample_params.sample_steps} 步 · 用时 ${Math.round(j.elapsed)}s`;
    }
    $('#go').disabled = false;
    return;
  }
  if (j.status === 'failed') { $('#status').textContent = '失败：' + (j.error || '未知'); $('#go').disabled = false; return; }
  state.timer = setTimeout(poll, 2000);
}
</script>
</body>
</html>
